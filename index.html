<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Controle Financeiro</title>
</head>
<body>
     <header class="header">
    <h1>Controle Financeiro</h1>
  </header>
 
 <main class="container">

      <section class="resumo">
      <div class="card card-saldo">
        <span class="card-label">Saldo</span>
        <span class="card-valor" id="saldo">R$ 0,00</span>
      </div>
 
      <div class="card card-receitas">
        <span class="card-label">Receitas</span>
        <span class="card-valor" id="total-receitas">R$ 0,00</span>
      </div>
 
      <div class="card card-despesas">
        <span class="card-label">Despesas</span>
        <span class="card-valor" id="total-despesas">R$ 0,00</span>
      </div>
    </section>
